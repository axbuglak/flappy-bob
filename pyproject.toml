[project]
name = "flappy-bob"
version = "0.1.0"
description = "Flappy Bob - IBM Bob live demo (Flappy Bird with the Bob mascot)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".starter"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.hatch.build.targets.wheel]
packages = ["game"]
